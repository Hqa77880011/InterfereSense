[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interferesense"
version = "0.1.0"
description = "InterfereSense method implementation and experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "torch>=2.4,<2.8", "torchvision>=0.19,<0.23", "scikit-learn>=1.3", "scipy>=1.10", "ruptures>=1.1.9", "psutil>=5.9", "nvidia-ml-py>=12"]

[project.scripts]
interferesense = "interferesense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
